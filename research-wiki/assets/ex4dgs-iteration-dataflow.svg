<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="1180" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1180" height="740" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#666"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#111">Ex4DGS — one training iteration</text>
  <text x="24" y="56" font-size="13" fill="#555">train.py:92-282. Two disjoint banks, always concatenated static-first, one rasterization.</text>

  <g font-size="11.5">
    <rect x="880" y="22" width="14" height="12" fill="#dfe9f5" stroke="#7fa0c4"/><text x="900" y="32" fill="#3a5170">static bank</text>
    <rect x="880" y="40" width="14" height="12" fill="#fae3d8" stroke="#d1905f"/><text x="900" y="50" fill="#8a4a1f">dynamic bank</text>
  </g>

  <!-- progressive window -->
  <rect x="40" y="86" width="466" height="104" rx="8" fill="#f3f7f1" stroke="#9cbf94"/>
  <text x="58" y="108" font-size="13" font-weight="700" fill="#38612e">the progressive temporal window</text>
  <text x="58" y="128" font-size="11.5" fill="#44703a">starts at <tspan font-family="Consolas,monospace">start_duration = 10</tspan> frames, grows <tspan font-family="Consolas,monospace">+10</tspan> every 400 iters</text>
  <text x="58" y="146" font-size="11.5" fill="#44703a">reaches the full 300 frames near iteration <tspan font-weight="700">12000</tspan></text>
  <text x="58" y="166" font-size="11.5" fill="#44703a">It restricts <tspan font-style="italic">which GT frames exist this epoch</tspan> &#8212; it is not a mask.</text>
  <text x="58" y="182" font-size="10.5" fill="#5d8352" font-family="Consolas,monospace">scene/__init__.py:271 samplelist</text>

  <!-- window bar viz -->
  <rect x="530" y="100" width="300" height="18" rx="3" fill="#e4e4de" stroke="#bbb"/>
  <rect x="530" y="100" width="24" height="18" rx="3" fill="#7fae70"/>
  <text x="530" y="94" font-size="10" fill="#666">it 500</text>
  <rect x="530" y="126" width="300" height="18" rx="3" fill="#e4e4de" stroke="#bbb"/>
  <rect x="530" y="126" width="150" height="18" rx="3" fill="#7fae70"/>
  <text x="530" y="160" font-size="10" fill="#666">it 6000</text>
  <rect x="530" y="152" width="300" height="18" rx="3" fill="#7fae70" stroke="#5d8352"/>
  <text x="840" y="114" font-size="10.5" fill="#666">10 frames</text>
  <text x="840" y="140" font-size="10.5" fill="#666">~150 frames</text>
  <text x="840" y="166" font-size="10.5" fill="#666">300 frames (it &#8805; 12000)</text>

  <line x1="273" y1="190" x2="273" y2="216" stroke="#666" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- camera -->
  <rect x="150" y="218" width="246" height="46" rx="6" fill="#f4f4f0" stroke="#aaa"/>
  <text x="273" y="239" font-size="12.5" font-weight="600" text-anchor="middle" fill="#222">pop camera + next(GT), jointly shuffled</text>
  <text x="273" y="256" font-size="10.5" text-anchor="middle" fill="#666" font-family="Consolas,monospace">train.py:124-125 &#183; lazy joblib, n_jobs=2</text>

  <line x1="273" y1="264" x2="273" y2="292" stroke="#666" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- two banks -->
  <rect x="40" y="294" width="230" height="128" rx="6" fill="#dfe9f5" stroke="#7fa0c4"/>
  <text x="155" y="316" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f4a68">STATIC bank</text>
  <text x="155" y="336" font-size="11" text-anchor="middle" fill="#3a5170">opacity = sigmoid(_opacity)</text>
  <text x="155" y="352" font-size="11" font-weight="700" text-anchor="middle" fill="#b03a1f">NO temporal opacity</text>
  <text x="155" y="372" font-size="11" text-anchor="middle" fill="#3a5170">but position DOES drift:</text>
  <text x="155" y="388" font-size="10.5" text-anchor="middle" fill="#4f6d8f" font-family="Consolas,monospace">_xyz + _xyz_disp &#183; t/duration</text>
  <text x="155" y="406" font-size="10" text-anchor="middle" fill="#4f6d8f" font-family="Consolas,monospace">c_gaussian_model.py:180</text>

  <rect x="290" y="294" width="272" height="128" rx="6" fill="#fae3d8" stroke="#d1905f"/>
  <text x="426" y="316" font-size="12.5" font-weight="700" text-anchor="middle" fill="#8a4a1f">DYNAMIC bank</text>
  <text x="426" y="336" font-size="11" text-anchor="middle" fill="#8a4a1f">opacity = sigmoid(_opacity_motion)</text>
  <text x="426" y="352" font-size="11" text-anchor="middle" fill="#8a4a1f">&#215; time_bigaussian(c, v, t)</text>
  <text x="426" y="372" font-size="11" text-anchor="middle" fill="#8a4a1f">keyframed xyz / rotation, K = 37</text>
  <text x="426" y="388" font-size="10.5" text-anchor="middle" fill="#a0602c">Catmull-Rom &#183; slerp</text>
  <text x="426" y="406" font-size="10" text-anchor="middle" fill="#a0602c" font-family="Consolas,monospace">opacity is NOT keyframed</text>

  <path d="M 155 422 L 155 446 L 300 446" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#a2)"/>
  <path d="M 426 422 L 426 446 L 320 446" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- concat + raster -->
  <rect x="310" y="452" width="330" height="60" rx="6" fill="#f0eaf6" stroke="#9b82b8"/>
  <text x="475" y="474" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4e3a68">concat static-first, then ONE rasterization</text>
  <text x="475" y="492" font-size="11" text-anchor="middle" fill="#5c4678"><tspan font-family="Consolas,monospace">static_num</tspan> is the split index used everywhere after</text>
  <text x="475" y="506" font-size="10" text-anchor="middle" fill="#6f5a8a" font-family="Consolas,monospace">gaussian_renderer/__init__.py:100-109</text>

  <!-- CUDA note -->
  <rect x="672" y="294" width="468" height="122" rx="8" fill="#e8f2f9" stroke="#2f7fb8"/>
  <text x="692" y="318" font-size="13" font-weight="700" fill="#14567f">CUDA receives an already-evaluated scalar opacity</text>
  <text x="692" y="340" font-size="11.5" fill="#33566d">Python computes the temporal factor; the extension has <tspan font-weight="700">no time concept at all</tspan>.</text>
  <text x="692" y="358" font-size="11.5" fill="#33566d">A scan for time-like tokens returns only <tspan font-family="Consolas,monospace">time_api</tspan>, <tspan font-family="Consolas,monospace">time_error</tspan>.</text>
  <text x="692" y="380" font-size="12" font-weight="700" fill="#14567f">&#8658; going from K=1 to K intervals needs NO CUDA change.</text>
  <text x="692" y="400" font-size="11" fill="#33566d">The only cull that matters is the per-pixel <tspan font-family="Consolas,monospace">alpha &lt; 1/255</tspan> (forward.cu:380).</text>

  <line x1="640" y1="482" x2="672" y2="482" stroke="#666" stroke-width="1.4"/>
  <path d="M 672 482 L 700 482 L 700 420" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#a2)"/>

  <line x1="475" y1="512" x2="475" y2="538" stroke="#666" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- loss -->
  <rect x="250" y="540" width="450" height="76" rx="6" fill="#fff8e6" stroke="#d9b45a"/>
  <text x="475" y="561" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6b5518">loss = 0.8&#183;L1 + 0.2&#183;(1-SSIM) + static_reg + motion_reg</text>
  <text x="475" y="580" font-size="11" text-anchor="middle" fill="#7a6222"><tspan font-weight="700">plus the l1_accum hook</tspan> &#8212; NOT an optical-flow loss</text>
  <text x="475" y="596" font-size="10.5" text-anchor="middle" fill="#8a7333">a register_hook swaps the flow gradient for [&#931;&#945;, &#931;l1, &#931;ssim],</text>
  <text x="475" y="610" font-size="10.5" text-anchor="middle" fill="#8a7333">which is how per-primitive error accounting reaches the prune rules</text>

  <!-- right column: structural ops -->
  <rect x="726" y="436" width="414" height="180" rx="8" fill="#fbfbf8" stroke="#bbb"/>
  <text x="742" y="458" font-size="13" font-weight="700" fill="#444">structural ops</text>
  <text x="742" y="480" font-size="11.5" fill="#333"><tspan font-weight="700">clone / split</tspan> every 300 iters, 500&#8211;30000</text>
  <text x="742" y="498" font-size="11" fill="#b03a1f">&#8594; both RESET var to 2 and jitter center</text>
  <text x="742" y="520" font-size="11.5" fill="#333"><tspan font-weight="700">static &#8594; dynamic promotion</tspan></text>
  <text x="742" y="537" font-size="11" fill="#555">top 2% by displacement; DELETES the donor static rows</text>
  <text x="742" y="554" font-size="10.5" fill="#777" font-family="Consolas,monospace">extract_dynamic_points_from_static:1147-1227</text>
  <text x="742" y="576" font-size="11.5" fill="#333"><tspan font-weight="700">adjust_temp_opa</tspan> every 1200 iters &#183; <tspan font-weight="700">expand_duration</tspan> every 400</text>
  <text x="742" y="596" font-size="11" fill="#b03a1f">reset_opacity is never called &#8212; opacity_reset_interval is dead</text>

  <line x1="475" y1="616" x2="475" y2="640" stroke="#666" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="300" y="642" width="350" height="42" rx="6" fill="#f4f4f0" stroke="#aaa"/>
  <text x="475" y="662" font-size="12" font-weight="600" text-anchor="middle" fill="#222">backward &#8594; nan_to_num on var.grad &#8594; RAdam step</text>
  <text x="475" y="677" font-size="10.5" text-anchor="middle" fill="#666" font-family="Consolas,monospace">train.py:170, :246-250 &#183; 15 param groups</text>

  <text x="24" y="712" font-size="12" fill="#333"><tspan font-weight="700">Note there is no in-training evaluation at all.</tspan> <tspan font-family="Consolas,monospace">test_iterations</tspan> defaults to [7000000] and the appending lines are commented out,</text>
  <text x="24" y="730" font-size="12" fill="#333">so each run yields exactly one held-out number, from <tspan font-family="Consolas,monospace">render.py</tspan> afterwards. There is no curve and no early-peak to detect.</text>
</svg>
