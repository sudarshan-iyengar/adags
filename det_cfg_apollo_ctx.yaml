# Context-based `det cmd run` config for M1 preprocessing/validation tasks.
#
# Differences from det_cfg_apollo_dgx.yaml (which stays untouched for plain
# shell probes), each required by the execution-closure rules of
# research-wiki/operations/elgs-m0-m1-implementation-plan.md section 10.2:
#   - NO work_dir: tasks run from the uploaded `det cmd run -c <context>`
#     directory (a `git archive` materialization of a pushed commit), never
#     from the shared mutable worktree; work_dir cannot be combined with a
#     context upload without landing files in the shared tree.
#   - NO ADAGS_REPO_ROOT: nothing may resolve code from the worktree.
# Pool/image default to the CPU-cheap dgx pool; override per invocation with
#   --config resources.resource_pool=hopper
#   --config environment.image=<digest-pinned image>
# for GPU preprocessing (tracker) tasks.
description: ADAGS Apollo context task runtime
resources:
  resource_pool: dgx
  slots: 1
environment:
  image: sudarshaniyengar/adags:apollo-v100-v1
  force_pull_image: true
  environment_variables:
    - HOME=/apollo/users/sri
    - CUDA_HOME=/usr/local/cuda-11.8
    - PYTHONUNBUFFERED=1
    - PYTHONNOUSERSITE=1
    - TORCH_EXTENSIONS_DIR=/tmp/adags_torch_extensions
    - XDG_CACHE_HOME=/tmp/adags_cache
    - MPLCONFIGDIR=/tmp/adags_mpl
    - WANDB_MODE=disabled
    - ADAGS_PROJECT_ROOT=/apollo/users/sri/proj_adags
