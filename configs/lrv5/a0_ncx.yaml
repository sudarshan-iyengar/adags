# LRV5-NCX substrate (A0-equivalent), for the non-convex hull falsifier.
#
# A BYTE-FOR-BYTE copy of configs/lrv3/a0.yaml with EXACTLY ONE line
# changed: source_path. Nothing else may differ -- the falsifier compares a
# membership OPERATOR across two object geometries, so every training
# constant must be held fixed or the comparison measures the config.
#
# Ungated by construction (elgs_enable: false). Per the 2026-08-24 block
# directive this lane runs the MINIMUM trained substrate needed for
# membership scoring and does NOT run gated reconstruction training, so no
# a1-equivalent config is created here.
#
# Spec: research-wiki/operations/nonconvex-hull-falsifier-spec-2026-08-24.md
# LRV3 oracle-headroom cell A0: ADAGS temporal control
#
# LRV3 -- LRV2 with ONE change: the RETURN is 3 frames (57-59) instead of 6.
# 3.0, so that every visible surface lies inside the initialization cloud.
#
# LRV1's A0 reached 34.23 dB on training views and 19.31 dB held out. The cause
# was measured, not guessed: 13.94% of every LRV1 image showed ground surface
# OUTSIDE the [-1.3, 1.3]^3 init cube. Densification clones and splits existing
# primitives and cannot create them from nothing, so those pixels were fitted by
# floaters that satisfy the 16 training views and are wrong from the 4 held-out
# ones. At half extent 1.3 the uncovered fraction measures 0.00%.
#
# Everything else -- cameras, frames, the event object and its timing, the
# oracle-episode files, the training budget, the capacity policy -- is
# unchanged, and the held-out event supply is identical at 113,868 return
# pixel-times.
#
# EXPLORATORY, evidence_bearing: false. Scene LRV3 is the controlled
# leave-and-return fixture built by scripts/build_synthetic_reveal_scene.py:
# 20-camera surround ring, 60 frames, 16 train / 4 held-out cameras, one object
# present over frames 0-29, GENUINELY ABSENT over 30-53 (removed from the world,
# not occluded), present again over 54-59 at the same pose.
#
# The three cells differ ONLY in the lines marked DIFFERS. Everything else is
# byte-identical across A0/A1/A2 and must stay that way.

gaussian_dim: 4
time_duration: [0.0, 10.0]
num_pts: 50_000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  source_path: "/apollo/users/sri/proj_adags/data/synthetic/lrv5_ncx"
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 4_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 150_000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 0.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.1666666667
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  # ---- DIFFERS (A0) ----------------------------------------------------
  # Temporal-Gaussian substrate: no EL-GS state at all, so presence is the
  # ordinary temporal marginal. `elgs_reserved_parity` exists ONLY so this
  # control drops exactly the units an EL-GS cell drops -- without it the
  # control would train on ~33% more data than A1/A2.
  elgs_enable: false
  elgs_reserved_parity: true
