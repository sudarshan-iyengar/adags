# LRV3 B1-PACKETS: the temporal substrate plus the CCR packet-birth
# operator, on the authored leave-and-return fixture.
#
# Purpose (Lane 4, 2026-08-20): produce the trained state for the
# oracle-correct / wrong-identity falsification of the B2 directional
# donor DC edit (research-wiki/operations/ccr-method-2026-08-20.md
# Claim A side). Byte-identical to a0_local_control.yaml except the
# packet_birth block below, which carries EXACTLY the N3V ladder B1
# operator parameters (ladder_b1_crb.yaml) so the operator under test
# is the operator that ran on N3V.
gaussian_dim: 4
time_duration: [0.0, 10.0]
num_pts: 50_000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  source_path: "/apollo/users/sri/proj_adags/data/synthetic/lrv3"
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 4_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 150_000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 4.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.1666666667
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  # ---- DIFFERS (A0') -----------------------------------------------------
  # Temporal-Gaussian substrate: no EL-GS state at all, so presence is the
  # ordinary temporal marginal. `elgs_reserved_parity` exists ONLY so this
  # control drops exactly the units an EL-GS cell drops -- without it the
  # control would train on ~33% more data than A1-LOCAL.
  packet_birth_enable: true
  packet_birth_interval: 500
  packet_birth_fraction: 0.005
  packet_birth_t_sigma_frames: 1.5
  packet_birth_from_iter: 1000
  packet_birth_until_iter: 4000
  elgs_enable: false
  elgs_reserved_parity: true

