# B1: the current ADAGS temporal substrate under the STG-matched N3V protocol.
#
# EXPLORATORY, evidence_bearing: false. Byte-identical to lane_l0_route0.yaml
# except for the two lines marked MATCHED, and it exists because the recorded
# ADAGS figure for this scene is not on the published protocol's scale.
#
# `cut_roasted_beef` 34.366 dB was measured at ModelParams.resolution: 2 applied
# to PNGs that scripts/n3v2blender.py had ALREADY halved -- so 676x507, one
# quarter of the pixels of the 1352x1014 at which Spacetime Gaussians trains,
# evaluates and publishes 33.52 dB. It was also a single model over all 300
# frames, where STG's published number is a 50-frame model (six per scene, run
# in series). Comparing 34.37 against 33.52 across that gap is not supported,
# and this cell is what makes the ADAGS side of the comparison legitimate.
#
#   MATCHED  batch_size: 2   -> was 4. Experiment 169 died with CUDA OOM at
#                               iteration 3510/6000 on a V100 32GB, having
#                               reached the 600k point cap: "Tried to allocate
#                               2.71 GiB ... 28.98 GiB reserved in total".
#                               Image-space buffers scale with the raster, and
#                               this cell quadrupled it. Halving the batch
#                               halves that peak -- and it also moves the ADAGS
#                               side TOWARD the published protocol rather than
#                               away from it, because STG trains N3V at batch 2.
#                               Disclosed as a change to ADAGS's own budget: at
#                               a fixed 6000 iterations, batch 2 sees half the
#                               gradient samples batch 4 did.
#   MATCHED  resolution: 1   -> 1352x1014, the published training/eval raster
#   MATCHED  time_duration   -> frames 0-49 inclusive (t = frame/30, so the
#                               upper bound must exceed 49/30 = 1.63333 and
#                               fall below 50/30 = 1.66667)
#
# Everything else is ADAGS's OWN published budget -- 6000 iterations, batch 4,
# 600k point cap -- and is deliberately NOT moved toward STG's 30k/batch-2
# schedule. Truncating STG to 6000 would measure a crippled STG (its
# densify_until_iter alone is 9000), so each side runs at its own budget and
# the resource ledger is reported alongside the metric.
#
# This cell alone does NOT reproduce STG. It is comparable to a PUBLISHED
# number on the protocol axes that were previously mismatched, which is a
# screening measurement, not a reproduction.

gaussian_dim: 4
time_duration: [0.0, 1.6340]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 6_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 4.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.0333333333
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  elgs_reserved_parity: true
  packet_birth_enable: true
  packet_birth_interval: 500
  packet_birth_fraction: 0.005
  packet_birth_t_sigma_frames: 1.5
  packet_birth_from_iter: 1000
  packet_birth_until_iter: 4000

