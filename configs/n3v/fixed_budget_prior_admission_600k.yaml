# Self-calibrated prior admission on LoRA route0 at the 600k point budget.
gaussian_dim: 4
time_duration: [0.0, 10.0]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: false
force_sh_3d: true
batch_size: 4
exhaust_test: false

ModelParams:
  images: "images"
  resolution: 2
  eval: true
  dataloader: true

PipelineParams:
  eval_shfs_4d: true
  env_optimize_until: 5000000000

OptimizationParams:
  iterations: 6_000
  position_lr_max_steps: 6_000
  opacity_reset_interval: 30000
  densify_until_iter: 6_000
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  enable_hard_static_conversion: false
  enable_soft_routing: true
  route_logit_init: 0.0
  route_lr: -1.0
  motion_model: "lora"
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 0
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.05
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_track_dt: 0.0333333333
  enable_rendered_flow: true
  enable_motion_aware_densify: false
  enable_prior_admission: true
  prior_admission_calibration_views: 4
  prior_admission_calibration_max_side: 160
  prior_admission_min_hard_coverage: 0.05
  prior_admission_flow_mass_tolerance: 1.05
  prior_admission_use_flow_agreement: true
  prior_admission_use_static_anchor: true
  prior_admission_use_hard_floor: true
  prior_admission_alpha: 0.05
  prior_admission_eta_anchor: 1.0
  prior_admission_hard_quantile: 0.8
  prior_admission_anchor_pool_radius: 2
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
