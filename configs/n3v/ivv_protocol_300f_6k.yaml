# IVV-protocol N3V table -- one config, all six scenes.
#
# EXPLORATORY, evidence_bearing: false. The scene is supplied at submit time
# via --source_path, so all six cells share ONE config content hash and the
# protocol is provably identical across scenes.
#
# Matches the evaluation protocol the ImViD/IVV paper states for N3V:
#   resolution   2x downsample of native 2704x2028 -> 1352x1014. n3v2blender
#                has ALREADY halved the PNGs on disk, so `resolution: 1` here
#                IS the 2x downsample -- setting 2 would give 676x507, the
#                quarter-raster error that inflated the historical family
#                1.1-1.5 dB (stg-n3v-protocol-parity-2026-08-19 section 1).
#   frames       300 per scene; time_duration [0, 10] at 30 FPS.
#   train/test   one held-out viewpoint, Camera 0 for N3V.
#   metrics      PSNR, SSIM, LPIPS(AlexNet). BOTH LPIPS conventions are now
#                emitted (utils/mesh_utils.py): they differ 18.4% on real
#                images and only one of them is what published GS tables use.
#
# NOT the 50-frame protocol. configs/n3v/b1_stg_matched_cut_roasted_beef.yaml
# uses frames 0-49 because STG's PUBLISHED PER-SCENE NUMBER is a 50-frame
# model (STG trains six per scene). That is a statement about STG's model
# duration, not about N3V, and it is the wrong unit for an IVV-style table.
#
# Derived from b0c_canonical_crb300.yaml -- the same protocol at 36,000
# iterations, which already pins route_logit_init: 4.0. THREE lines differ,
# all schedule:
#   iterations 36_000 -> 6_000             USER-DIRECTED.
#   position_lr_max_steps 36_000 -> 6_000  LR horizon follows the schedule
#                                          instead of decaying against a
#                                          horizon the run never reaches.
#   densify_until_iter 30_000 -> 5_000     keeps B0-C's 83% ratio and its
#                                          settling-phase rationale.
#
# STATED PLAINLY, because it bounds what these numbers mean: 6,000 iterations
# at batch 2 over 5,700 training units is ~2.1 presentations per unit. B0-C
# ran 12.63/unit, and the 2026-08-20 measurement puts this family's PSNR peak
# near 12,000 iterations. These cells are UNDER-TRAINED relative to both. They
# are a same-protocol CROSS-SCENE comparison, not this substrate's best
# achievable N3V number, and must not be cited as the latter.
#
gaussian_dim: 4
time_duration: [0.0, 10.0]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 40000
  densify_from_iter: 500
  densify_until_iter: 5_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 4.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.0333333333
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100

