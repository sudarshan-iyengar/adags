# Google Immersive (DeepView Video) -- LoRA lane, 50-frame pilot protocol.
#
# EXPLORATORY, evidence_bearing: false.
#
# NOT COMPARABLE TO PUBLISHED IMMERSIVE NUMBERS, and this is a property of the
# method rather than of the tuning. STG trains Immersive in FISHEYE space,
# warping the render into fisheye at loss time through per-camera inverse flow
# maps; ADAGS has no such path (scene/cameras.py fisheyemapper is a dead None).
# scripts/immersive_to_blender.py therefore produces a PINHOLE scene, which is
# a different method. Numbers from this config may be compared across
# Immersive scenes and against ADAGS itself, never against STG's or the ImViD
# paper's Immersive tables.
#
# PROTOCOL, and where each part comes from:
#   raster        1280x960. The ImViD paper applies 2x downsampling to Google
#                 Immersive; native is 2560x1920. The converter has ALREADY
#                 done that downsample, so `resolution: 1` here is correct and
#                 `resolution: 2` would halve a second time -- the exact
#                 quarter-raster error that inflated the N3V family 1.1-1.5 dB.
#   held-out      camera_0001, written into transforms_test.json by the
#                 converter. STG selects it positionally; the ImViD paper says
#                 "Camera 1 for Google Immersive". They agree.
#   frames        0-49 at 30/1 fps -> time in [0, 49/30 = 1.63333]. The upper
#                 bound below must exceed that and fall below 50/30.
#   cameras       45 calibrated of 46 shipped; camera_0046 has no calibration
#                 in this scene and is dropped by name, not by position.
#
# The LoRA recipe is unchanged from the N3V lane so the two are comparable to
# each other: motion_model lora, rank 8, 32 anchors, soft routing, and
# route_logit_init declared explicitly at 4.0 because the YAML value did not
# bind before the 2026-08-20 repair and 4.0 is worth about +0.50 dB.
#
# motion_prior_root is empty and dynamic_mask_from_residual is true: there are
# no precomputed motion priors for Immersive, so the dynamic mask is the
# top-quantile photometric residual of the current render, exactly as in the
# N3V lane. That is a property of the recipe, not of this dataset.

gaussian_dim: 4
time_duration: [0.0, 1.6340]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 5_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 4.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.0333333333
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
