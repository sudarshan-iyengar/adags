# LRV1 oracle-headroom PREFLIGHT: A1 truncated to 800 iterations
#
# EXPLORATORY, evidence_bearing: false. Scene LRV1 is the controlled
# leave-and-return fixture built by scripts/build_synthetic_reveal_scene.py:
# 20-camera surround ring, 60 frames, 16 train / 4 held-out cameras, one object
# present over frames 0-29, GENUINELY ABSENT over 30-53 (removed from the world,
# not occluded), present again over 54-59 at the same pose.
#
# BYTE-IDENTICAL to a1.yaml except `iterations: 800`. Its whole job is to
# cross iteration 600 -- where densification first fires under this capacity
# policy, and where the elgs_a optimizer-group defect used to crash -- and to
# exercise three real densify/prune events (600, 700, 800) with a live K=2
# presence program. It is NOT a result: 800 iterations answers no scientific
# question here.

gaussian_dim: 4
time_duration: [0.0, 10.0]
num_pts: 50_000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  source_path: "/apollo/users/sri/proj_adags/data/synthetic/lrv1"
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 800
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 4_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 150_000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 0.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.1666666667
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  # ---- DIFFERS (A1) ----------------------------------------------------
  # EL-GS episodic presence with a FIXED K=2 oracle program. Structural rounds
  # are off, so this measures the representation and nothing else: no proposal,
  # no acceptance, no capacity reallocation. `elgs_a_lr: 0.0` FREEZES the
  # supplied boundaries -- they are an oracle, not something to be learned, and
  # freezing removes any chance of A2 drifting toward the correct timing.
  # `elgs_reserved_parity` is a no-op here (the EL-GS path already reserves).
  elgs_enable: true
  elgs_rounds_enabled: false
  elgs_prereg_dir: "configs/elgs"
  elgs_smoke_schedule: false
  elgs_tracks_dir: ""
  elgs_oracle_episodes: "configs/lrv1/oracle_correct.json"
  elgs_a_lr: 0.0
  elgs_reserved_parity: false
  elgs_beta: 0.1
  elgs_kappa: 0.01
  elgs_chi: 0.01
  elgs_mu: 0.01
  elgs_tau_b: 1.0
  elgs_k_se: 1.0
  elgs_lambda_u: 1.0
  elgs_c_cap: 4
  elgs_candidate_cap: 2
  elgs_confirmation_samples: 8
  elgs_r_site: 0.5
  elgs_binding_threshold: 0.25
