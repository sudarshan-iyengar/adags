# ImViD PAPER-PROTOCOL PARITY -- PUPPY / FG / Cam00 held out (FINAL)
#
# Frozen by [[operations/imvid-paper-parity-freeze-2026-08-26]]. Read that
# page before changing ANY field here; the window, the split, the metric, the
# evaluator, the promotion rule and the final endpoint are frozen and an
# amendment is append-only with every affected arm rerun.
#
# ARM: FG -- SEA-RAFT-guided. Candidate geometry classified static/dynamic/
#      ABSTAIN; static initialized once from the reference frame with broad
#      temporal support, dynamic at its own timestamp with compact support,
#      abstention preserved. SEA-RAFT is an explicit substitution for the
#      paper's VideoFlow and the paper's epsilon_f is NOT transplanted.
#
# SCHEDULE, and it is DERIVED not tuned. H0 scales the canonical 300-frame
# N3V config (configs/n3v/b0c_canonical_crb300.yaml) to the user-directed
# 12,000-iteration endpoint by its own two stated couplings:
#   position_lr_max_steps == iterations        (decay horizon == schedule)
#   densify_until_iter    ~= 0.83 * iterations (30,000/36,000 there)
# No Cam 00 number was consulted to choose any value here, and none may be.
#
# EXPOSURE, reported because "12k" does not mean here what it means on N3V.
# This window is 300 frames x 38 training cameras = 11400 units.
# At batch_size 2 and 12,000 iterations that is 2.105 presentations/unit,
# against 12.63 for the canonical N3V 300-frame cell -- roughly 6.0x LESS
# exposure per unit. Every number from this config carries that figure.
#
# ENDPOINTS. save_iterations writes chkpnt6000.pth and chkpnt12000.pth
# (scene/__init__.py:104). test_iterations is set to the FINAL iteration only,
# deliberately: main.py:1646-1651 saves chkpnt_best.pth whenever the TEST psnr
# improves, and under the paper split the test camera is Cam 00 -- so an
# intermediate test evaluation would make the trainer select a checkpoint on
# held-out data. With test_iterations at the endpoint alone, no selection can
# occur. The reported 6k and 12k numbers come from a separate `--val` pass
# over each checkpoint, which is the clamped/pooled/LPIPS-AlexNet convention
# the freeze names as primary; the training-time path is unclamped, has no
# LPIPS, and may never appear in a reported table.
#
# CAPACITY. densify_until_num_points is the SHARED point-ceiling policy and is
# identical in both arms. The initial population is capped at half that
# ceiling so BOTH arms exercise densification; an arm starting at or above the
# ceiling would skip the whole densification-and-pruning block
# (main.py:1658) and would not be comparable. num_pts sits above any initial
# cloud so scene/dataset_readers.py:497-513 never subsamples -- its sampler
# uses np.random.randint and returns DUPLICATES.
#

gaussian_dim: 4
test_iterations: [12_000]
save_iterations: [6_000, 12_000]
time_duration: [0.0, 4.988316666666667]
num_pts: 1_000_000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 2
exhaust_test: False

ModelParams:
  sh_degree: 3
  source_path: "/apollo/users/sri/proj_adags/data/imvid/win/puppy_f0_299/arm_fg"
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 12_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 12_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 10_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600_000
  final_prune_from_iter: -1
  # 30 -> qualitative renders at held-out frames 0,30,...,270: ten per
  # evaluation, at indices IDENTICAL across every arm. Applied after all
  # metrics are computed (main.py:1062-1064), so it cannot move a number;
  # exporting all 300 costs ~40 min of pure I/O per evaluation.
  export_image_stride: 30
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 0.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.016683333333333335  # 1001/60000 EXACTLY, never the repo-wide 1/30
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  # ---- DIFFERS (A0) ----------------------------------------------------
  # Temporal-Gaussian substrate: no EL-GS state at all, so presence is the
  # ordinary temporal marginal. `elgs_reserved_parity` exists ONLY so this
  # control drops exactly the units an EL-GS cell drops -- without it the
  # control would train on ~33% more data than A1/A2.
  elgs_enable: false
  elgs_reserved_parity: true
