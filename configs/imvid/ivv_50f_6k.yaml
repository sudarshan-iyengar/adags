# ImViD LoRA lane -- 50-frame window, 6,000 iterations. EXPLORATORY.
#
# Scene comes from --source_path at submit time, so one config serves both
# opera and puppy and the protocol is identical by construction. `source_path`
# is deliberately ABSENT below: main.py merges the config over the parsed args,
# so a source_path here would silently override the CLI.
#
# FIVE FIELDS ARE LOAD-BEARING AND EACH FAILS QUIETLY IF CHANGED
#
#   eval: True        scene/dataset_readers.py:475-477 MERGES the test split
#                     into training when this is False. The held-out camera
#                     would train, and nothing would report it.
#   resolution: 1     utils/camera_utils.py rescales cx/cy by a naive divide
#                     rather than the frozen pixel-centre convention, so any
#                     value but 1 corrupts the principal point. The 2x
#                     downsample the ImViD paper specifies is ALREADY baked in:
#                     these frames are 2656x1494, converted at --scale 0.5.
#                     Downsample offline, never here.
#   num_pts           3,000,000. The reader SUBSAMPLES a cloud larger than
#                     num_pts (dataset_readers:497-513). The arm_nf clouds hold
#                     282,672 (opera) and 300,000 (puppy) points, so the
#                     smoke config's 50_000 would silently discard ~85% of the
#                     initialisation.
#   time_duration     [0, 0.8180] selects frames 0-49. ImViD runs at
#                     60000/1001 = 59.94 fps, so the frame period is 0.0166833 s
#                     and frame 49 lands at 0.817483. The bound must exceed
#                     that and fall below frame 50 at 0.834167.
#   batch_size: 1     NOT 2. Image-space buffers scale with the raster and
#                     2656x1494 is 2.9x N3V's 1352x1014, which already needed
#                     expandable_segments to survive densification on a 64 GB
#                     A100. Halving the batch halves that peak.
#
# EXPOSURE, stated because it bounds what these numbers mean: 50 frames x 38
# training cameras = 1,900 units; 6,000 iterations at batch 1 is 3.16
# presentations per unit. The full 300-frame window would be 11,400 units and
# ~1.05 presentations/unit, which is why the window exists -- the 2026-08-24
# block already recorded that the full take cannot be trained at any
# authorised schedule.
#
# INITIALISATION PROVENANCE: the point cloud ships with the arm_nf scene, i.e.
# the NO-FLOW arm of the 2026-08-24 fg/nf comparison, not a fresh neutral
# triangulation. Its manifest records excluded_cameras = ['cam00'] and a
# capped, single-temporal-extent cloud. Both scenes use the same arm, so they
# are comparable to each other; neither is comparable to a run initialised
# some other way.

gaussian_dim: 4
time_duration: [0.0, 0.8180]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 1
exhaust_test: False

ModelParams:
  sh_degree: 3
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 5_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 4.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.0166833
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
