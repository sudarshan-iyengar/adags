# SWEEP CELL S2 — densification schedule: densify_until_iter 6000 -> 4000
#
# Frozen matrix: research-wiki/operations/diva360-scissor-sweep-matrix-v1.md
# Base: configs/elgs/diva360_scissor_bench30.yaml (experiment 84).
# ONLY the change named above differs from the base. No learning rate
# anywhere in this matrix is altered. Ranked on the carved development
# split; the six official held-out cameras are unreachable from it.
#
# DiVa-360 scissor BENCHMARK-ALIGNED development baseline.
#
# ONE baseline, not a sweep. Its job is to establish protocol parity and a
# real development number, replacing the 20.698 dB / 0.867 SSIM figure that
# `research-wiki/operations/diva360-protocol-parity-audit.md` shows is not
# comparable to anything published.
#
# STILL EXPLORATORY (`--exploratory`, evidence_bearing false). Photometric
# only; the evidence path is off.
#
# ---------------------------------------------------------------------
# Provenance of these settings: this is
# `configs/n3v/fixed_budget_lora_route0_600k.yaml` -- the repository's
# proven ADAGS default and the fixed comparison `research-wiki/query_pack.md`
# names ("LoRA route0 at 6000 iterations and a 600k point ceiling", best-val
# 28.24 dB on N3V cut_roasted_beef) -- adapted to DiVa-360. Every deviation
# from that file is listed here; nothing else moved.
#
#   1. `time_duration: [0, 4.7]`  (N3V: [0, 10]). 561 frames / 120 fps.
#   2. `resolution: 1`  (N3V: 2). THE PROTOCOL REQUIREMENT: DiVa-360's
#      calibration space IS 1160x550, so resolution 1 evaluates at exactly
#      the official resolution. Experiments 71/79 ran at `resolution: 4`,
#      i.e. 290x138 and one sixteenth of the pixels (audit mismatch M2).
#   3. `frame_ratio: 1`, `extension: ".png"` -- the DiVa-360 converter's
#      conventions, same as the earlier DiVa configs.
#   4. `dataloader: True` is INHERITED from the N3V default and is now
#      load-bearing rather than incidental: at 1160x550 an eager decode of
#      the training split would hold ~7.6 MB per image resident. The
#      earlier DiVa configs left it at the `False` default and got away
#      with it only because 290x138 is 1/16 the size.
#   5. `num_pts` is NOT raised. The DiVa-360 converter synthesizes
#      `points3d.ply` with 20,000 points and the Blender branch uses the
#      ply, so `num_pts` is inert here; the run initializes from the SAME
#      20,000-point cloud experiments 71/79 used. Retaining the
#      initialization is deliberate -- it keeps schedule and capacity
#      effects separable from initialization effects in this first
#      baseline, so a later initialization change is attributable.
#
# The dataset is the NEW 30-FPS materialization
# (`scissor_screen_w0_561_s4_30fps`, stride 4). The 120-FPS conversion and
# every artifact derived from it -- the sealed cotracker3 tracks, the
# census, experiments 71-83 -- are untouched and still valid for their own
# lanes.
#
# What the earlier DiVa-360 photometric lane did that this one does not:
#   * stop densifying at iteration 2000 of 3000. Here densification runs
#     from 500 through 6000, i.e. THROUGHOUT the optimization, which is
#     what the proven default does.
#   * cap capacity at 300k. Here 600k, the proven ceiling.
#   * train 3000 iterations. Here 6000, the proven budget (and exactly
#     main.py's DEFAULT_MAX_TRAIN_ITERATIONS, so no guard override).
#
# Target: published scissor parity, ~25-26 PSNR / ~0.94 SSIM / LPIPS
# ~0.08-0.10. 30+ PSNR is a later aspiration, not this run's bar.

gaussian_dim: 4
time_duration: [0, 4.7]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 4
exhaust_test: False

test_iterations: [500, 1000, 2000, 3000, 4000, 5000, 6000]
save_iterations: [3000, 6000]

ModelParams:
  sh_degree: 3
  images: "images"
  resolution: 1                # 1160x550 -- the official evaluation size
  white_background: False      # black background; GT is alpha-composited on it
  data_device: "cuda"
  eval: True                   # official 35-train / 6-held-out shipped split
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True             # lazy decode -- required at this resolution

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 4_000    # densification THROUGHOUT, not stopped at 2000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 0.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.0333333333   # 1/30 s -- matches the 30-FPS sampling
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  elgs_enable: False              # PHOTOMETRIC ONLY
