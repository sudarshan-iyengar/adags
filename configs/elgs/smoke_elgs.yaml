# EL-GS Apollo GPU smoke (S1/S2) — NOT evidence-bearing.
#
# Derived from configs/n3v/smoke_apollo.yaml (the infra-only smoke
# profile) with the EL-GS switch on and a compressed schedule; every
# elgs_* key below must exist on the argparse surface
# (tests/test_elgs_configs.py enforces recursive_merge compatibility
# statically, the same guard tests/test_lane_configs.py gives the
# lane matrix). Category-1 structural constants and schedule anchors
# come from the prereg files under elgs_prereg_dir, never from here.
# Runs stamped evidence_bearing: false by the submission wrapper.

gaussian_dim: 4
time_duration: [0, 10.0]
num_pts: 50_000
rot_4d: False
force_sh_3d: True
batch_size: 2

ModelParams:
  sh_degree: 3
  resolution: 4
  frame_ratio: 8
  eval: True

OptimizationParams:
  iterations: 600
  densify_until_iter: 400
  densify_until_num_points: 60_000
  opacity_reset_interval: 30_000
  motion_model: "lora"
  elgs_enable: True
  elgs_prereg_dir: "configs/elgs"
  elgs_smoke_schedule: True
  elgs_beta: 0.1
  elgs_kappa: 0.01
  elgs_chi: 0.01
  elgs_mu: 0.01
  elgs_tau_b: 1.0
  elgs_k_se: 1.0
  # lambda_u = 1.0 makes the declared mixture literally m = nu — the
  # degenerate-valid SNIS case the smoke sampler actually implements
  # (uniform units, weights exactly 1); prereg_acceptance smoke_note.
  elgs_lambda_u: 1.0
  elgs_c_cap: 4
  elgs_candidate_cap: 8
  elgs_confirmation_samples: 16
  elgs_a_lr: 0.002
  elgs_r_site: 0.5
  elgs_binding_threshold: 0.25
