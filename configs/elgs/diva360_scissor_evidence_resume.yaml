# DiVa-360 evidence RESUME — EXPLORATORY INTEGRATION TEST.
#
# Short continuation from the evidence smoke's chkpnt600.pth. Answers
# only: do the persisted EL-GS evidence bindings and round bookkeeping
# survive a checkpoint round trip, and does training continue?
#
# Every structural anchor (seed 100, audit 150, rounds 200/350/500,
# refit_until 600) is already BEHIND the restore point, so this run must
# repeat NONE of them: rounds_run == [200, 350, 500] on load, and the
# 3 consumed slot-grid slots must not be redrawn. Identical config to
# the smoke apart from the iteration count.

gaussian_dim: 4
time_duration: [0, 4.7]
num_pts: 50_000
rot_4d: False
force_sh_3d: True
batch_size: 2

ModelParams:
  sh_degree: 3
  resolution: 4
  frame_ratio: 1
  eval: True

OptimizationParams:
  iterations: 700              # 600 restored + 100 continuation
  densify_until_iter: 400
  densify_until_num_points: 60_000
  opacity_reset_interval: 30_000
  motion_model: "lora"

  elgs_enable: True
  elgs_smoke_schedule: True
  elgs_prereg_dir: "configs/elgs"
  elgs_tracks_dir: "/apollo/users/sri/proj_adags/data/diva360_derived/scissor_screen_w0_561_tracks"

  elgs_beta: 0.1
  elgs_kappa: 0.01
  elgs_chi: 0.01
  elgs_mu: 0.01
  elgs_tau_b: 1.0
  elgs_k_se: 1.0
  elgs_lambda_u: 1.0
  elgs_c_cap: 4
  elgs_candidate_cap: 2
  elgs_confirmation_samples: 8
  elgs_a_lr: 0.002
  elgs_r_site: 0.05
  elgs_binding_threshold: 0.25
