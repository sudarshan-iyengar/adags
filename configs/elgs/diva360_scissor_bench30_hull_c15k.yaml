# DiVa-360 scissor -- COMBINED: visual-hull initialization PLUS the
# extended optimization exposure, continued from experiment 104 to 15,000.
#
# EXPLORATORY (`--exploratory`, evidence_bearing false). Photometric only.
#
# ---------------------------------------------------------------------
# WHY. Two single-factor interventions were each measured separately and
# each bought about a decibel on the OFFICIAL held-out split:
#
#   experiment 84   frustum init, 6000 iterations      21.3565 (official)
#   experiment 104  HULL init, 6000 iterations         22.4382   +1.082
#   experiment 101  frustum init, 15,000 iterations    22.3539   +0.997
#
# Neither reaches the per-frame oracle (25.719 official, 8 frames), and
# neither reaches published scissor. This lane runs the COMBINATION, and
# nothing else: hull initialization AND the longer exposure.
#
# THE TWO EFFECTS ARE NOT ASSUMED TO ADD. Both act on the same
# under-fitting; if they overlap, the combination lands well below
# 21.36 + 1.08 + 1.00. Recording that expectation here, before the run,
# so a sub-additive result is read as information rather than as failure.
#
# ---------------------------------------------------------------------
# Continuation mechanics are experiment 101's, exactly:
#
#   1. Resume experiment 104's own `chkpnt_best.pth`, which main.py
#      writes as `(gaussians.capture(), iteration)` at the best
#      validation -- iteration 6000, verified against that run's
#      summary.json (`best_val_iter: 6000`, 416,599 points). The restore
#      goes through `gaussians.restore(model_params, opt)`, so optimizer
#      state carries over and there is NO reset.
#
#   2. DENSIFICATION IS FROZEN AT THE RESUME BOUNDARY, and here that
#      needs no edit at all: `densify_until_iter` is already 6000 and
#      main.py guards the whole densification block with
#      `iteration < opt.densify_until_iter`, which is False from
#      iteration 6000 onward. So no cloning, splitting, pruning or
#      size-culling runs, and -- since the opacity-reset check is nested
#      inside that block -- no opacity reset either. The point count
#      holds at 416,599 for all 9,000 iterations and NO capacity is
#      added. That is deliberate: experiment 101 already showed the
#      densifying baseline is BEATEN at iteration 6000 by a frozen model
#      carrying 169,000 fewer points, so adding capacity is the wrong
#      response to this gap.
#
#   3. `position_lr_max_steps` STAYS at 6,000. The position learning
#      rate reaches its final value at 6000 and holds for the remaining
#      9,000 iterations. That IS experiment 104's schedule run past its
#      end, and it is identical in kind to what experiment 101 did.
#      Rescaling the decay would change the schedule, which this lane
#      must not do.
#
# EVERY other setting is byte-identical to
# `diva360_scissor_bench30.yaml`: scene, 35/6 split, 141-frame window,
# resolution, losses, all other learning rates, routing, motion
# configuration, capacity cap and seed. No new supervision. The scene
# is the HULL scene, so the visual-hull initialization is retained by
# construction.
#
# main.py's DEFAULT_MAX_TRAIN_ITERATIONS guard is 6000, so this lane is
# submitted with --max-train-iterations 15000.
#
# Deviations from the base config, and no others:
#   iterations       6_000 -> 15_000
#   test_iterations  milestones after resume: 8k, 10k, 12k, 15k
#   save_iterations  10k, 15k
# ---------------------------------------------------------------------

gaussian_dim: 4
time_duration: [0, 4.7]
num_pts: 300_0000
num_pts_ratio: 1.0
rot_4d: False
force_sh_3d: True
batch_size: 4
exhaust_test: False

test_iterations: [8000, 10000, 12000, 15000]
save_iterations: [10_000, 15_000]

ModelParams:
  sh_degree: 3
  images: "images"
  resolution: 1                # 1160x550 -- the official evaluation size
  white_background: False      # black background; GT is alpha-composited on it
  data_device: "cuda"
  eval: True                   # official 35-train / 6-held-out shipped split
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True             # lazy decode -- required at this resolution

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 15_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 6_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 30000
  densify_from_iter: 500
  densify_until_iter: 6_000    # == the resume iteration, so densification
                               # is FROZEN for this whole continuation. The
                               # value is unchanged from the base config;
                               # only its effect differs, because the loop
                               # now STARTS at 6000. See the header.
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: 600000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  enable_hard_static_conversion: false
  lambda_sparsity: 0.0
  lambda_motion_gate: 0.0
  static_conversion_threshold: 0.99
  gate_activation_iter: 1000
  gate_warmup_until_iter: 2000
  enable_soft_routing: true
  route_logit_init: 0.0
  route_lr: -1.0
  motion_model: "lora"
  motion_poly_order: 2
  motion_lr_init: -1.0
  motion_reg_lambda: 0.0
  motion_lora_rank: 8
  motion_lora_anchors: 32
  motion_lora_init_scale: 0.01
  motion_lora_coeff_lr: -1.0
  motion_lora_basis_lr: -1.0
  motion_prior_root: ""
  dynamic_mask_from_residual: true
  dynamic_mask_residual_quantile: 0.85
  dynamic_mask_dilate: 2
  lambda_dynamic_roi: 0.5
  lambda_static_exclusion: 0.02
  lambda_track_flow: 0.0
  lambda_scaffold_smooth: 0.0
  lambda_scaffold_reg: 0.0
  motion_scaffold_enable: false
  motion_scaffold_count: 512
  motion_scaffold_rank: 8
  motion_scaffold_anchors: 32
  motion_scaffold_knn: 4
  motion_scaffold_init_scale: 0.01
  motion_scaffold_weight_temp: 0.05
  motion_scaffold_chunk: 65536
  motion_scaffold_coeff_lr: -1.0
  motion_scaffold_basis_lr: -1.0
  motion_track_dt: 0.0333333333   # 1/30 s -- matches the 30-FPS sampling
  enable_rendered_flow: false
  enable_motion_aware_densify: false
  motion_aware_densify_boost: 1.0
  blur_until_iter: 0
  blur_start_sigma: 8.0
  histogram_log_interval: 100
  elgs_enable: False              # PHOTOMETRIC ONLY
